services:
  app:
    build: .
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/decksy.db"
      Database__MigrateOnStartup: "true"
      DataProtection__KeysPath: "/app/keys"
    volumes:
      - data:/app/data
      - keys:/app/keys
    # No published ports: the app is reachable only through Caddy.
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: "${DOMAIN}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  data:
  keys:
  caddy_data:
  caddy_config:
